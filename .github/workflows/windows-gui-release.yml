name: Windows GUI Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-gui-release.yml"
      - "pyproject.toml"
      - "scripts/run_gui.py"
      - "scripts/gui_smoke.py"
      - "scripts/phase8_preflight.py"
      - "src/instrument_capture_studio/ui/**"
      - "src/instrument_capture_studio/app/**"
      - "src/instrument_capture_studio/adapters/**"
      - "src/instrument_capture_studio/workflows/**"
      - "src/instrument_capture_studio/data/**"
      - "src/instrument_capture_studio/reporting/**"
      - "tests/**"

concurrency:
  group: windows-gui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-gui:
    runs-on: windows-latest

    steps:
      - name: Checkout Instrument Capture Studio
        uses: actions/checkout@v4

      - name: Checkout Instrument Automation Platform
        uses: actions/checkout@v4
        with:
          repository: yunfei00/instrument-automation-platform
          path: instrument-automation-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]" "pytest>=8" pyvisa pyvisa-py

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $archive = "InstrumentCaptureStudio-v$version-windows-x64.zip"
          $artifact = "InstrumentCaptureStudio-v$version-windows-x64"
          $releaseName = "Instrument Capture Studio v$version"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag/version mismatch: tag=$env:GITHUB_REF_NAME, pyproject=$expectedTag"
            }
          }

          Write-Host "Package version: $version"
          Write-Host "Archive name: $archive"

      - name: Run test suite
        shell: pwsh
        run: |
          pytest -q

      - name: Run split FSW platform regression
        shell: pwsh
        run: |
          python -m pytest -q instrument-automation-platform/tests/unit/test_fsw_arm_read.py

      - name: Run DSO-X Single STOP synchronization regression
        shell: pwsh
        run: |
          python -m pytest -q instrument-automation-platform/tests/unit/test_dsox3000_driver.py
          python -m pytest -q instrument-automation-platform/tests/unit/test_dsox3000_single_capture.py

      - name: Run release preflight self-check
        shell: pwsh
        run: |
          python scripts/phase8_preflight.py --self-check

      - name: Smoke-test real product GUI offscreen
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python scripts/gui_smoke.py

      - name: Build Windows GUI bundle
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name InstrumentCaptureStudio `
            --paths src `
            --paths instrument-automation-platform/packages/instrument_core/src `
            --paths instrument-automation-platform/packages/instrument_scpi/src `
            --paths instrument-automation-platform/packages/instrument_drivers/src `
            --paths instrument-automation-platform/packages/instrument_data/src `
            --paths instrument-automation-platform/packages/instrument_lab/src `
            --paths instrument-automation-platform/packages/instrument_qualification/src `
            scripts/run_gui.py

      - name: Add build information
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          $buildInfo = @(
            "product=Instrument Capture Studio",
            "version=$version",
            "repository=${{ github.repository }}",
            "ref=${{ github.ref }}",
            "sha=${{ github.sha }}",
            "built_at=$([DateTime]::UtcNow.ToString('o'))"
          )
          $buildInfo | Set-Content -Encoding UTF8 "dist/InstrumentCaptureStudio/BUILD.txt"

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/InstrumentCaptureStudio/*" `
            -DestinationPath "${{ steps.release_meta.outputs.archive }}" `
            -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_meta.outputs.artifact }}
          path: ${{ steps.release_meta.outputs.archive }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.release_name }}
          files: ${{ steps.release_meta.outputs.archive }}
          generate_release_notes: true
