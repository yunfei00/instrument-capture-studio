name: Windows GUI Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-gui-release.yml"
      - "pyproject.toml"
      - "scripts/run_gui.py"
      - "src/instrument_capture_studio/ui/**"
      - "src/instrument_capture_studio/app/**"
      - "src/instrument_capture_studio/adapters/**"
      - "src/instrument_capture_studio/workflows/**"
      - "src/instrument_capture_studio/data/**"
      - "tests/**"

permissions:
  contents: write

jobs:
  build-windows-gui:
    runs-on: windows-latest

    steps:
      - name: Checkout Instrument Capture Studio
        uses: actions/checkout@v4

      - name: Checkout Instrument Automation Platform
        uses: actions/checkout@v4
        with:
          repository: yunfei00/instrument-automation-platform
          path: instrument-automation-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]" "pytest>=8" pyvisa pyvisa-py

      - name: Run test suite
        shell: pwsh
        run: |
          pytest -q

      - name: Smoke-test GUI offscreen
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from instrument_capture_studio.ui.main_window import MainWindow; app = QApplication([]); window = MainWindow(); assert window.windowTitle() == 'Instrument Capture Studio'; assert window.start_button.text() == '开始采集'; window.close(); print('GUI smoke test PASS')"

      - name: Build Windows GUI bundle
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name InstrumentCaptureStudio `
            --paths src `
            --paths instrument-automation-platform/packages/instrument_core/src `
            --paths instrument-automation-platform/packages/instrument_scpi/src `
            --paths instrument-automation-platform/packages/instrument_drivers/src `
            --paths instrument-automation-platform/packages/instrument_data/src `
            --paths instrument-automation-platform/packages/instrument_lab/src `
            --paths instrument-automation-platform/packages/instrument_qualification/src `
            scripts/run_gui.py

      - name: Add build information
        shell: pwsh
        run: |
          $buildInfo = @(
            "repository=${{ github.repository }}",
            "ref=${{ github.ref }}",
            "sha=${{ github.sha }}",
            "built_at=$([DateTime]::UtcNow.ToString('o'))"
          )
          $buildInfo | Set-Content -Encoding UTF8 "dist/InstrumentCaptureStudio/BUILD.txt"

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/InstrumentCaptureStudio/*" `
            -DestinationPath "InstrumentCaptureStudio-windows-x64.zip" `
            -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstrumentCaptureStudio-windows-x64
          path: InstrumentCaptureStudio-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: InstrumentCaptureStudio-windows-x64.zip
          generate_release_notes: true
