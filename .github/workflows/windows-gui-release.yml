name: Windows GUI Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-gui-release.yml"
      - "pyproject.toml"
      - "scripts/run_gui.py"
      - "scripts/phase8_preflight.py"
      - "src/instrument_capture_studio/ui/**"
      - "src/instrument_capture_studio/app/**"
      - "src/instrument_capture_studio/adapters/**"
      - "src/instrument_capture_studio/workflows/**"
      - "src/instrument_capture_studio/data/**"
      - "src/instrument_capture_studio/reporting/**"
      - "tests/**"

concurrency:
  group: windows-gui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-gui:
    runs-on: windows-latest

    steps:
      - name: Checkout Instrument Capture Studio
        uses: actions/checkout@v4

      - name: Checkout Instrument Automation Platform
        uses: actions/checkout@v4
        with:
          repository: yunfei00/instrument-automation-platform
          path: instrument-automation-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]" "pytest>=8" pyvisa pyvisa-py

      - name: Run test suite
        shell: pwsh
        run: |
          pytest -q

      - name: Run split FSW platform regression
        shell: pwsh
        run: |
          python -m pytest -q instrument-automation-platform/tests/unit/test_fsw_arm_read.py

      - name: Run DSO-X Single STOP synchronization regression
        shell: pwsh
        run: |
          python -m pytest -q instrument-automation-platform/tests/unit/test_dsox3000_driver.py
          python -m pytest -q instrument-automation-platform/tests/unit/test_dsox3000_single_capture.py

      - name: Run release preflight self-check
        shell: pwsh
        run: |
          python scripts/phase8_preflight.py --self-check

      - name: Smoke-test real product GUI offscreen
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QLabel; from instrument_capture_studio.ui.app import create_application, create_main_window; app=create_application([]); window=create_main_window(); assert window.windowTitle() == 'Instrument Capture Studio'; assert type(window).__module__.endswith('commercial_window'); assert window.safe_close_pending is False; assert window.connection_tests_active == 0; assert window.capture_mode_combo.count() == 3; assert window.capture_mode_combo.findText('固定频率连续采集') >= 0; assert window.recipe_combo.count() == 3; assert window.recipe_combo.findText('EXT联合 + IMM配对样本') >= 0; assert window.recipe_combo.findText('IMM频谱单采') >= 0; assert window.recipe_combo.findText('示波器单采') >= 0; assert window.waveform_channel_spin.minimum() == 1 and window.waveform_channel_spin.maximum() == 4; assert hasattr(window, 'pause_button'); assert window.pause_button.text() == '暂停采集'; assert hasattr(window, 'resume_previous_button'); assert hasattr(window, 'resume_summary_label'); assert hasattr(window, 'template_combo'); assert hasattr(window, 'batch_report_button'); assert hasattr(window, 'batch_trace_export_button'); assert hasattr(window, 'recipe_debug_button'); assert window.recipe_debug_button.text() == '工程调试 / 单步采集'; assert hasattr(window, 'followup_position_edit'); assert hasattr(window, 'followup_scale_edit'); assert hasattr(window, 'commercial_nav') and window.commercial_nav.count() == 6; assert window.commercial_nav.item(0).text() == '任务采集'; assert window.commercial_nav.item(1).text() == '仪表连接'; assert window.commercial_nav.item(2).text() == '数据与报告'; assert window.commercial_stack.count() == 6; assert hasattr(window, 'commercial_task_parameter_card'); assert window.commercial_task_parameter_card.title() == '任务关键参数'; window.recipe_combo.setCurrentText('EXT联合 + IMM配对样本'); window.capture_mode_combo.setCurrentText('单次采集'); window._sync_recipe_controls(); assert window.followup_position_edit.isVisibleTo(window.commercial_task_parameter_card); assert not window.center_hz_edit.isVisibleTo(window.commercial_task_parameter_card); window.capture_mode_combo.setCurrentText('固定频率连续采集'); window._sync_sweep_mode(); assert window.center_hz_edit.isVisibleTo(window.commercial_task_parameter_card); window._update_recipe_summary(); assert 'Single' in window.recipe_summary_label.text(); badge=window.findChild(QLabel, 'alphaBadge'); assert badge is not None and badge.text() == 'v1.0.0 · Final RC'; window._controller.shutdown(); window.deleteLater(); print('Commercial paged Final RC GUI smoke test PASS')"

      - name: Build Windows GUI bundle
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name InstrumentCaptureStudio `
            --paths src `
            --paths instrument-automation-platform/packages/instrument_core/src `
            --paths instrument-automation-platform/packages/instrument_scpi/src `
            --paths instrument-automation-platform/packages/instrument_drivers/src `
            --paths instrument-automation-platform/packages/instrument_data/src `
            --paths instrument-automation-platform/packages/instrument_lab/src `
            --paths instrument-automation-platform/packages/instrument_qualification/src `
            scripts/run_gui.py

      - name: Add build information
        shell: pwsh
        run: |
          $version = python -c "import importlib.metadata; print(importlib.metadata.version('instrument-capture-studio'))"
          $buildInfo = @(
            "product=Instrument Capture Studio",
            "version=$version",
            "repository=${{ github.repository }}",
            "ref=${{ github.ref }}",
            "sha=${{ github.sha }}",
            "built_at=$([DateTime]::UtcNow.ToString('o'))"
          )
          $buildInfo | Set-Content -Encoding UTF8 "dist/InstrumentCaptureStudio/BUILD.txt"

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/InstrumentCaptureStudio/*" `
            -DestinationPath "InstrumentCaptureStudio-windows-x64.zip" `
            -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstrumentCaptureStudio-windows-x64
          path: InstrumentCaptureStudio-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: InstrumentCaptureStudio-windows-x64.zip
          generate_release_notes: true
