[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-capture-studio"
version = "1.2.0"
description = "Commercial instrument acquisition software for oscilloscopes and spectrum analyzers."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
gui = [
    "PySide6>=6.7,<7",
]
build = [
    "PyInstaller>=6.11,<7",
    "PySide6>=6.7,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
