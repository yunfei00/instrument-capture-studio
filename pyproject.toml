[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-capture-studio"
version = "0.1.0"
description = "Commercial instrument acquisition software for oscilloscopes and spectrum analyzers."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
